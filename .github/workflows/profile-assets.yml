name: Generate profile assets

on:
  schedule:
    - cron: "17 */12 * * *"   # every 12 hours
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same cards as github-readme-stats, but rendered here instead of on the paused public server.
      # Optional: add a classic PAT (scopes: repo, read:user) as secret PROFILE_PAT to count private contributions.
      - name: Stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=radical&border_color=FF0000&title_color=FF0000&icon_color=00FFFF&text_color=FFFFFF&bg_color=0D1117&include_all_commits=true&count_private=true&line_height=24"
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=radical&title_color=FF0000&text_color=FFFFFF&border_color=FF0000&bg_color=0D1117&langs_count=8"
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}

      # Contribution snake, coloured to match the red theme (replaces the activity graph).
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#00FFFF&color_dots=#161b22,#4c0000,#8b0000,#cc0000,#ff0000

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile assets"
          file_pattern: "profile/*.svg"
